; Ajustes de PHP en producción, encima de php.ini-production.
; Los errores nunca se muestran al cliente: van al registro de Apache (Logs de Render).
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
; Las trazas de los errores registrados no incluyen los argumentos de las funciones.
zend.exception_ignore_args = On
date.timezone = Europe/Madrid
memory_limit = 128M
post_max_size = 64K
upload_max_filesize = 0
file_uploads = Off
allow_url_fopen = Off
