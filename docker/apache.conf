# Sitio único de Apache en el contenedor. Sirve solo public/; lo que no es un archivo va al router.

ServerName planificador
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/planificador/public

    <Directory /var/www/planificador/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        # El router (index.php) atiende todo lo que no sea un archivo de public/: también
        # /src/... o /index.php/..., que acaban en su 404. Nunca se traducen rutas a ficheros.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Cabeceras de seguridad también en los archivos estáticos (HTML, JS, CSS). En las respuestas
    # de PHP se quita la copia de PHP antes de ponerlas, para que no salgan duplicadas.
    Header unset Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'"
    Header unset X-Content-Type-Options
    Header always set X-Content-Type-Options "nosniff"
    Header unset Referrer-Policy
    Header always set Referrer-Policy "same-origin"
    Header unset X-Frame-Options
    Header always set X-Frame-Options "DENY"
    Header always unset X-Powered-By

    # Registros a la salida del contenedor: Render los muestra en "Logs".
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
